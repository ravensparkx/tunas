        box-shadow:0 0 8px rgba(255,0,110,.4)
      }
      50%{
        opacity:1;
        box-shadow:0 0 17px rgba(255,0,110,.9)
      }
    }

    @keyframes rvStatusBlink{
      0%,100%{opacity:.45}
      50%{opacity:1}
    }

    @keyframes rvScanMove{
      0%{top:-20%;opacity:0}
      15%{opacity:1}
      75%{opacity:.75}
      100%{top:115%;opacity:0}
    }

    @keyframes rvButtonShine{
      0%,35%{left:-55%;opacity:0}
      48%{opacity:.75}
      68%,100%{left:130%;opacity:0}
    }

    @keyframes rvSealReveal{
      0%{
        opacity:0;
        transform:rotate(45deg) scale(.15)
      }
      65%{
        opacity:1;
        transform:rotate(225deg) scale(1.12)
      }
      100%{
        opacity:1;
        transform:rotate(225deg) scale(1)
      }
    }

    @keyframes rvBrandReveal{
      to{
        opacity:1;
        transform:translateY(0);
        letter-spacing:2.8px
      }
    }

    @keyframes rvBrandShine{
      to{left:130%}
    }

    @keyframes rvLineExpand{
      to{width:180px}
    }

    @keyframes rvSubtitleReveal{
      to{opacity:.8}
    }

    @keyframes rvPanelLeft{
      to{transform:translateX(-105%)}
    }

    @keyframes rvPanelRight{
      to{transform:translateX(105%)}
    }

    @keyframes rvOpeningHide{
      to{
        opacity:0;
        visibility:hidden
      }
    }

    @media(min-height:780px){

    }

    @media(max-width:480px){

    @media(max-width:350px){

    @media(prefers-reduced-motion:reduce){
